amcl:
  ros__parameters:
    use_sim_time: false 

map_server:
  ros__parameters:
    use_sim_time: false

## 全局规划器
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0           # 每秒规划5次路线
    planner_plugins: ["GridBased"]            # 规划器别名

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5
      allow_unknown: true
      downsample_costmap: false
      downsampling_factor: 1
      angle_quantization_bins: 72
      minimum_turning_radius: 2.0
      motion_model_for_search: "REEDS_SHEPP"
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      use_quadratic_cost_penalty: false
      downsample_obstacle_heuristic: true
      allow_primitive_interpolation: false
      smooth_path: true

# 局部控制器
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0            # 10hz
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    odom_topic: /fastlio2/lio_odom

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 10.0             # 实车避障/转向较慢，放宽卡死判定

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.10                   # Ackermann实车先放宽到20cm，避免过度贴点
      yaw_goal_tolerance: 0.20                  # Hunter SE不适合原地调头，主要保证位置到达

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      # Ackermann底盘限制：只采样前后速度和角速度，不允许横移/原地急转。
      min_vel_x: 0.05
      max_vel_x: 0.45
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.18

      min_speed_xy: 0.05
      max_speed_xy: 0.45
      min_speed_theta: 0.0

      acc_lim_x: 0.4
      acc_lim_y: 0.0
      acc_lim_theta: 0.5
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -0.6

      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 15

      sim_time: 1.8
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.8
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true

      critics: ["Oscillation", "BaseObstacle", "PathAlign", "GoalAlign", "PathDist", "GoalDist", "PreferForward"]
      BaseObstacle.scale: 0.05
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.6
      GoalAlign.scale: 16.0
      GoalAlign.forward_point_distance: 0.6
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      PreferForward.scale: 8.0

# 全局代价地图
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map         # 世界坐标系
      robot_base_frame: body    # 机器人坐标系
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true

      footprint: "[[0.48, 0.34], [0.48, -0.34], [-0.48, -0.34], [-0.48, 0.34]]"           # Hunter SE安全轮廓

      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 4.0

      always_send_full_costmap: true

# 局部代价地图
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: body
      update_frequency: 15.0
      publish_frequency: 10.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 1.0

      # 碰撞轮廓配置
      footprint: "[[0.48, 0.34], [0.48, -0.34], [-0.48, -0.34], [-0.48, 0.34]]"

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        tf_filter_tolerance: 0.5
        footprint_clearing_enabled: true
        observation_sources: body_cloud_mark

        body_cloud_mark:
          topic: /nav2/obstacle_cloud       # 过滤后的局部障碍点云
          data_type: PointCloud2
          marking: true
          clearing: true
          observation_persistence: 0.0
          expected_update_rate: 0.5
          obstacle_min_range: 0.55
          obstacle_max_range: 2.5
          raytrace_min_range: 0.55
          raytrace_max_range: 4.0
          min_obstacle_height: 0.40
          max_obstacle_height: 1.00

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 6.0

      always_send_full_costmap: true

