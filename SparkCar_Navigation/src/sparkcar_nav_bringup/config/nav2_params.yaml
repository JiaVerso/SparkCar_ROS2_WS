amcl:
  ros__parameters:
    use_sim_time: false 

map_server:
  ros__parameters:
    use_sim_time: false

## 全局规划器
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0           # BT以1Hz持续重规划，及时绕开新出现的动态障碍
    planner_plugins: ["GridBased"]            # 规划器别名

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5
      allow_unknown: true
      downsample_costmap: false
      downsampling_factor: 1
      angle_quantization_bins: 72
      minimum_turning_radius: 1.8
      motion_model_for_search: "REEDS_SHEPP"
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 2.0
      analytic_expansion_max_cost: 200
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.5
      cost_penalty: 3.5
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      use_quadratic_cost_penalty: true
      downsample_obstacle_heuristic: true
      allow_primitive_interpolation: false
      smooth_path: true

# 局部控制器
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 15.0            # 提高转向指令刷新率，减小阿克曼跟踪迟滞
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0                 # TEB短暂无解时先停车等待重规划，不立即终止FollowPath
    odom_topic: /fastlio2/lio_odom
    transform_tolerance: 0.3

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 15.0             # 给行人避障、重规划和阿克曼转向留出时间

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15                   # Ackermann实车先放宽到15cm，避免过度贴点
      yaw_goal_tolerance: 0.30                  # Hunter SE不适合原地调头，主要保证位置到达

    FollowPath:
      plugin: "teb_local_planner::TebLocalPlannerROS"
      odom_topic: /fastlio2/lio_odom

      # 轨迹采样
      teb_autosize: 1.0
      dt_ref: 0.25
      dt_hysteresis: 0.1
      min_samples: 5
      max_samples: 500
      global_plan_overwrite_orientation: true
      allow_init_with_backwards_motion: true
      global_plan_viapoint_sep: 0.9
      via_points_ordered: true
      max_global_plan_lookahead_dist: 5.0
      global_plan_prune_distance: 1.0
      exact_arc_length: false
      feasibility_check_no_poses: 5
      feasibility_check_lookahead_distance: 1.5
      control_look_ahead_poses: 3

      # Hunter 阿克曼约束
      max_vel_x: 0.60
      max_vel_x_backwards: 0.20
      max_vel_y: 0.0
      max_vel_theta: 0.35
      acc_lim_x: 0.60
      acc_lim_y: 0.0
      acc_lim_theta: 0.6
      min_turning_radius: 1.8
      wheelbase: 0.52
      cmd_angle_instead_rotvel: false
      is_footprint_dynamic: false
      use_proportional_saturation: true

      # 必须与costmap轮廓一致，否则TEB按点机器人优化后会在可行性检查阶段失败
      footprint_model:
        type: "polygon"
        vertices: "[[0.48, 0.34], [0.48, -0.34], [-0.48, -0.34], [-0.48, 0.34]]"

      # 到点判定
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
      free_goal_vel: false

      # 障碍物约束
      min_obstacle_dist: 0.30
      inflation_dist: 0.42
      include_costmap_obstacles: true
      include_dynamic_obstacles: false
      costmap_obstacles_behind_robot_dist: 0.5
      obstacle_poses_affected: 15
      legacy_obstacle_association: false
      obstacle_association_force_inclusion_factor: 1.5
      obstacle_association_cutoff_factor: 5.0
      costmap_converter_plugin: ""
      costmap_converter_spin_thread: true
      costmap_converter_rate: 5

      # 优化权重
      no_inner_iterations: 5
      no_outer_iterations: 4
      optimization_activate: true
      optimization_verbose: false
      penalty_epsilon: 0.05
      weight_max_vel_x: 2.0
      weight_max_vel_y: 2.0
      weight_max_vel_theta: 1.0
      weight_acc_lim_x: 1.0
      weight_acc_lim_y: 1.0
      weight_acc_lim_theta: 10.0
      weight_kinematics_nh: 1000.0
      weight_kinematics_forward_drive: 100.0
      weight_kinematics_turning_radius: 100.0
      weight_optimaltime: 0.1
      weight_shortest_path: 0.0
      weight_obstacle: 50.0
      weight_inflation: 0.1
      weight_viapoint: 6.0
      weight_adapt_factor: 2.0

      # 正前方被占用时同时搜索障碍物左右两侧的可行轨迹
      enable_homotopy_class_planning: true
      enable_multithreading: true
      max_number_classes: 3
      selection_cost_hysteresis: 0.8
      selection_prefer_initial_plan: 0.90
      roadmap_graph_area_width: 4.0
      viapoints_all_candidates: false
      delete_detours_backwards: false

      # 恢复策略
      shrink_horizon_backup: true
      shrink_horizon_min_duration: 3.0
      oscillation_recovery: true
      oscillation_v_eps: 0.1
      oscillation_omega_eps: 0.1
      oscillation_recovery_min_duration: 5.0

# 全局代价地图
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map         # 世界坐标系
      robot_base_frame: body    # 机器人坐标系
      update_frequency: 3.0
      publish_frequency: 2.0
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.3

      footprint: "[[0.48, 0.34], [0.48, -0.34], [-0.48, -0.34], [-0.48, 0.34]]"           # Hunter SE安全轮廓

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        tf_filter_tolerance: 0.5
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: global_cloud_clear global_cloud_mark

        global_cloud_clear:
          topic: /nav2/clearing_cloud
          data_type: PointCloud2
          marking: false
          clearing: true
          observation_persistence: 0.0
          expected_update_rate: 0.5
          obstacle_min_range: 0.30
          obstacle_max_range: 4.0
          raytrace_min_range: 0.30
          raytrace_max_range: 4.0
          min_obstacle_height: -0.50
          max_obstacle_height: 1.50

        global_cloud_mark:
          topic: /nav2/obstacle_cloud
          data_type: PointCloud2
          marking: true
          clearing: false
          observation_persistence: 0.0
          expected_update_rate: 0.5
          obstacle_min_range: 0.55
          obstacle_max_range: 2.5
          raytrace_min_range: 0.55
          raytrace_max_range: 4.0
          min_obstacle_height: 0.40
          max_obstacle_height: 1.00

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.60
        cost_scaling_factor: 2.0

      always_send_full_costmap: true

# 局部代价地图
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: body
      update_frequency: 20.0
      publish_frequency: 7.0
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      transform_tolerance: 0.3

      # 碰撞轮廓配置
      footprint: "[[0.48, 0.34], [0.48, -0.34], [-0.48, -0.34], [-0.48, 0.34]]"

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        tf_filter_tolerance: 0.5
        footprint_clearing_enabled: true
        observation_sources: body_cloud_clear body_cloud_mark

        body_cloud_clear:
          topic: /nav2/clearing_cloud       # 使用较完整的前向点云给局部代价地图做射线清除
          data_type: PointCloud2
          marking: false
          clearing: true
          observation_persistence: 0.0
          expected_update_rate: 0.5
          obstacle_min_range: 0.30
          obstacle_max_range: 4.0
          raytrace_min_range: 0.30
          raytrace_max_range: 4.0
          min_obstacle_height: -0.50
          max_obstacle_height: 1.50

        body_cloud_mark:
          topic: /nav2/obstacle_cloud       # 过滤后的局部障碍点云
          data_type: PointCloud2
          marking: true
          clearing: false
          observation_persistence: 0.0
          expected_update_rate: 0.5
          obstacle_min_range: 0.55
          obstacle_max_range: 2.5
          raytrace_min_range: 0.55
          raytrace_max_range: 4.0
          min_obstacle_height: 0.40
          max_obstacle_height: 1.00

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.50
        cost_scaling_factor: 2.5

      always_send_full_costmap: true

