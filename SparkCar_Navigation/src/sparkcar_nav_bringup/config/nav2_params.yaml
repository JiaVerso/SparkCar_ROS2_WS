behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: body
    cycle_frequency: 10.0
    behavior_plugins: ["backup"]

    backup:
      plugin: "nav2_behaviors/BackUp"

# 轨迹平滑
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# 生命周期管理
lifecycle_manager_navigation:
