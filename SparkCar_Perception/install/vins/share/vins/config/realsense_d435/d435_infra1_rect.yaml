camera_name: d435_infra1_rect
image_width: 848
image_height: 480

# image_rect_raw is already rectified.
distortion_parameters:
   k1: 0.0
   k2: 0.0
   p1: 0.0
   p2: 0.0

projection_parameters:
   fx: 427.5089416503906
   fy: 427.5089416503906
   cx: 432.07891845703125
   cy: 240.37538146972656

