%YAML:1.0

# Intel RealSense D435 infra1 + MicroAir H743 IMU through MAVROS
# VINS-Fusion configuration

# 1: enable IMU fusion
imu: 1

# Only cam0 is enabled because the calibrated camera/IMU extrinsic is for
# infra1. Enable stereo only after cam0-cam1 extrinsics have been verified.
num_of_cam: 1

imu_topic: "/mavros/imu/data_raw"
image0_topic: "/camera/camera/infra1/image_rect_raw"
output_path: "/home/orangepi/vins_output/"

# This file must be placed in the same configuration directory as this file.
cam0_calib: "d435_infra1_rect.yaml"

image_width: 848
image_height: 480

# GPU acceleration disabled for the first correctness test.
use_gpu: 0
use_gpu_acc_flow: 0
use_gpu_ceres: 0

# Kalibr camera-to-IMU extrinsic converted to VINS body_T_cam0:
# p_imu = R_imu_cam * p_cam + t_imu_cam
estimate_extrinsic: 0

body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 0.0064396401, -0.0081855330,  0.9999457626, 0.09088800,
          -0.9992909911,  0.0370419465,  0.0067386479, 0.01685749,
          -0.0370950969, -0.9992801866, -0.0079411926, 0.04631304,
           0.0,           0.0,           0.0,          1.0 ]

multiple_thread: 1

# Feature tracker
max_cnt: 120
min_dist: 25
freq: 15
F_threshold: 1.0
show_track: 0
flow_back: 1

# Optimization
max_solver_time: 0.04
max_num_iterations: 8
keyframe_parallax: 10.0

# Provisional H743 IMU parameters used during Kalibr calibration.
# Replace with Allan-variance results before flight.
acc_n: 0.01
gyr_n: 0.005
acc_w: 0.0002
gyr_w: 4.0e-6
g_norm: 9.805

# Kalibr result: image timestamp + td = IMU timestamp.
# Keep fixed because online td estimation diverged in the previous test.
estimate_td: 0
td: 0.00511901

# Disable pose-graph loading and image storage during initial VIO testing.
load_previous_pose_graph: 0
pose_graph_save_path: "/home/orangepi/vins_output/pose_graph/"
save_image: 0

